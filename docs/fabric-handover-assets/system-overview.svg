<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Kanavoogle Fabric system overview</title>
  <desc id="desc">The frontend and Express backend use MongoDB for application data and projections. The backend uses Fabric Gateway to send proposals to the Platform peer, collect its endorsement, and submit the endorsed transaction to the ordering service. The ordering service distributes blocks to Platform and Audit peers. Platform, Audit, and Orderer CAs enroll their organization's identities.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52657d" />
    </marker>
    <style>
      text { font-family: Aptos, "Segoe UI", Arial, sans-serif; fill: #14213d; }
      .title { font-size: 24px; font-weight: 700; }
      .group-title { font-size: 18px; font-weight: 700; }
      .node-title { font-size: 18px; font-weight: 700; }
      .node-copy { font-size: 15px; }
      .edge-label { font-size: 14px; font-weight: 600; }
      .app-node { fill: #eaf2ff; stroke: #4776b8; stroke-width: 2; }
      .fabric-node { fill: #e8f7f1; stroke: #27836d; stroke-width: 2; }
      .ca-node { fill: #fff4df; stroke: #c1872f; stroke-width: 2; }
      .projection-node { fill: #f2efff; stroke: #7865b0; stroke-width: 2; }
      .app-area, .fabric-area { fill: #fffaf0; stroke: #d8c9a8; stroke-width: 1.5; }
      .line { fill: none; stroke: #52657d; stroke-width: 2; marker-end: url(#arrow); }
      .dash-line { fill: none; stroke: #7865b0; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <text class="title" x="600" y="30" text-anchor="middle">Kanavoogle Fabric system overview</text>

  <rect class="ca-node" x="465" y="48" width="270" height="74" rx="12" />
  <text class="node-title" x="600" y="77" text-anchor="middle">Platform CA</text>
  <text class="node-copy" x="600" y="101" text-anchor="middle">User, backend, and peer identities</text>
  <path class="dash-line" d="M 600 122 L 600 192" />

  <rect class="app-area" x="40" y="155" width="1120" height="175" rx="14" />
  <text class="group-title" x="62" y="183">Application layer</text>
  <rect class="app-node" x="80" y="210" width="230" height="78" rx="12" />
  <text class="node-title" x="195" y="255" text-anchor="middle">Next.js frontend</text>
  <rect class="app-node" x="430" y="200" width="340" height="98" rx="12" />
  <text class="node-title" x="600" y="238" text-anchor="middle">Express backend</text>
  <text class="node-copy" x="600" y="263" text-anchor="middle">Fabric Gateway client - service identity</text>
  <path class="line" d="M 310 249 L 420 249" />
  <text class="edge-label" x="365" y="235" text-anchor="middle">HTTPS /api + JWT</text>
  <rect class="projection-node" x="930" y="210" width="230" height="78" rx="12" />
  <text class="node-title" x="1045" y="241" text-anchor="middle">MongoDB</text>
  <text class="node-copy" x="1045" y="265" text-anchor="middle">Profiles + projections</text>
  <path class="line" d="M 770 249 L 920 249" marker-start="url(#arrow)" />
  <text class="edge-label" x="845" y="235" text-anchor="middle">App and projection data</text>

  <rect class="fabric-area" x="40" y="365" width="1120" height="225" rx="14" />
  <text class="group-title" x="1135" y="393" text-anchor="end">Hyperledger Fabric network - energychannel</text>
  <path class="line" d="M 560 298 L 560 355 L 230 355 L 230 410" />
  <text class="edge-label" x="395" y="344" text-anchor="middle" stroke="#fffaf0" stroke-width="6" paint-order="stroke">Proposal via Gateway</text>
  <path class="line" d="M 720 298 L 720 400 L 600 400 L 600 410" />
  <text class="edge-label" x="610" y="392" text-anchor="middle" stroke="#fffaf0" stroke-width="6" paint-order="stroke">Submit endorsed tx</text>

  <rect class="fabric-node" x="80" y="420" width="300" height="98" rx="12" />
  <text class="node-title" x="230" y="451" text-anchor="middle">Platform peer</text>
  <text class="node-copy" x="230" y="476" text-anchor="middle">energy-market chaincode</text>
  <text class="node-copy" x="230" y="498" text-anchor="middle">ledger + world state</text>

  <rect class="fabric-node" x="465" y="420" width="270" height="98" rx="12" />
  <text class="node-title" x="600" y="456" text-anchor="middle">Ordering service</text>
  <text class="node-copy" x="600" y="482" text-anchor="middle">energychannel</text>

  <rect class="fabric-node" x="820" y="420" width="300" height="98" rx="12" />
  <text class="node-title" x="970" y="451" text-anchor="middle">Audit peer</text>
  <text class="node-copy" x="970" y="476" text-anchor="middle">energy-market chaincode</text>
  <text class="node-copy" x="970" y="498" text-anchor="middle">ledger + world state</text>

  <path class="line" d="M 455 490 L 380 490" />
  <text class="edge-label" x="418" y="512" text-anchor="middle">Block</text>
  <path class="line" d="M 735 468 L 810 468" />
  <text class="edge-label" x="772" y="455" text-anchor="middle">Block</text>

  <path class="dash-line" d="M 600 620 L 600 520" />
  <path class="dash-line" d="M 970 620 L 970 520" />
  <rect class="ca-node" x="490" y="620" width="220" height="64" rx="12" />
  <text class="node-title" x="600" y="659" text-anchor="middle">Orderer CA</text>
  <rect class="ca-node" x="860" y="620" width="220" height="64" rx="12" />
  <text class="node-title" x="970" y="659" text-anchor="middle">Audit CA</text>
  <text class="node-copy" x="600" y="706" text-anchor="middle">Fabric ledger and world state are authoritative for wallet and marketplace records.</text>
</svg>
