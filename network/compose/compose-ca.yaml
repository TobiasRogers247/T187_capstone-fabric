networks:
  energy:
    name: ${FABRIC_NETWORK_NAME:-energy_fabric}

services:
  ca_platform:
    container_name: ca_platform
    image: hyperledger/fabric-ca:${FABRIC_CA_IMAGE_TAG:-1.5.17}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-platform
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    ports:
      - "7054:7054"
      - "17054:17054"
    command: sh -c 'fabric-ca-server start -b ${PLATFORM_CA_ADMIN_USER:-admin}:${PLATFORM_CA_ADMIN_PASSWORD:-adminpw} -d'
    volumes:
      - ../../organizations/fabric-ca/platform:/etc/hyperledger/fabric-ca-server
    networks:
      - energy

  ca_audit:
    container_name: ca_audit
    image: hyperledger/fabric-ca:${FABRIC_CA_IMAGE_TAG:-1.5.17}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-audit
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:18054
    ports:
      - "8054:8054"
      - "18054:18054"
    command: sh -c 'fabric-ca-server start -b ${AUDIT_CA_ADMIN_USER:-admin}:${AUDIT_CA_ADMIN_PASSWORD:-adminpw} -d'
    volumes:
      - ../../organizations/fabric-ca/audit:/etc/hyperledger/fabric-ca-server
    networks:
      - energy

  ca_orderer:
    container_name: ca_orderer
    image: hyperledger/fabric-ca:${FABRIC_CA_IMAGE_TAG:-1.5.17}
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-orderer
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:19054
    ports:
      - "9054:9054"
      - "19054:19054"
    command: sh -c 'fabric-ca-server start -b ${ORDERER_CA_ADMIN_USER:-admin}:${ORDERER_CA_ADMIN_PASSWORD:-adminpw} -d'
    volumes:
      - ../../organizations/fabric-ca/ordererOrg:/etc/hyperledger/fabric-ca-server
    networks:
      - energy
